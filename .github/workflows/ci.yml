name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    name: Backend API
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: neu_companion_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build API
        run: npm --workspace apps/api run build

      - name: Run API tests
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/neu_companion_test
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          NODE_ENV: test
          PORT: 3001
        run: npm --workspace apps/api run test

      - name: Start API for smoke test
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/neu_companion_test
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          NODE_ENV: test
          PORT: 3001
        run: |
          npm --workspace apps/api run start:prod &
          SERVER_PID=$!

          echo "Waiting for API to start..."

          for i in {1..30}; do
            if curl -sf http://localhost:3001/ > /dev/null; then
              echo "✓ API health check passed"
              kill $SERVER_PID 2>/dev/null || true
              wait $SERVER_PID 2>/dev/null || true
              exit 0
            fi

            echo "API not ready yet... ($i/30)"
            sleep 1
          done

          echo "✗ API failed to become ready"
          kill $SERVER_PID 2>/dev/null || true
          wait $SERVER_PID 2>/dev/null || true
          exit 1
