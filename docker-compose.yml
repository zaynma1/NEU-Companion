services:
  postgres:
    image: postgres:16-alpine
    container_name: neu-companion-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-neu_companion}
      POSTGRES_USER: ${POSTGRES_USER:-neu_companion}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-neu_companion}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: neu-companion-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
